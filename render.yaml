services:
  - type: web
    name: pwa-push-server
    env: node
    plan: free
    region: oregon
    buildCommand: ""
    startCommand: "npm run start:server"
    healthCheckPath: "/"
    envVars:
      - key: VAPID_PUBLIC_KEY
        value: "<your-vapid-public-key>"
      - key: VAPID_PRIVATE_KEY
        value: "<your-vapid-private-key>"
